<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercato Smart - Annunci</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --bg-card: #ffffff;
            --text: #222222;
            --text-soft: #777777;
            --accent: #1e88ff;
            --accent-soft: #e3f2fd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --bg-card: #111827;
                --text: #e5e7eb;
                --text-soft: #9ca3af;
                --accent: #3b82f6;
                --accent-soft: #1e293b;
            }
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }

        header {
            background: linear-gradient(90deg, #1e88ff, #3b82f6);
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .logo-area span {
            font-weight: bold;
            font-size: 18px;
        }

        .theme-toggle {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
        }

        .intro {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(15,23,42,0.25);
            background-image: radial-gradient(circle at top left, rgba(59,130,246,0.25), transparent 55%);
        }

        .intro h2 {
            margin-top: 0;
        }

        .contacts {
            margin-top: 10px;
            padding: 10px;
            background: var(--accent-soft);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
        }

        .contacts a {
            color: var(--accent);
            font-weight: bold;
        }

        .annunci {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(15,23,42,0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 35px rgba(15,23,42,0.35);
        }

        .card-top {
            padding: 18px 18px 10px;
            display: flex;
            justify-content: center;
        }

        .card-top img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 6px 16px rgba(15,23,42,0.35);
        }

        .card-content {
            padding: 0 18px 18px;
            text-align: center;
        }

        .card-content h3 {
            margin: 8px 0 4px;
            font-size: 18px;
        }

        .card-content p {
            margin: 0;
            color: var(--text-soft);
            font-size: 14px;
        }

        .card-btn {
            margin-top: 12px;
        }

        .card-btn a {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(59,130,246,0.45);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-soft);
        }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <img src="logo.png" alt="Mercato Smart">
        <span>Mercato Smart</span>
    </div>
    <button class="theme-toggle" id="themeToggle">Auto</button>
</header>

<div class="container">

    <div class="intro">
        <h2>Benvenuto su Mercato Smart</h2>
        <p>Un piccolo mercato online dove puoi pubblicare e trovare oggetti in modo semplice.</p>

        <div class="contacts">
            <p><strong>Aggiungere un oggetto:</strong><br>
            <a href="mailto:vigonetechteam@protonmail.com?subject=Aggiunta%20Annuncio">
                vigonetechteam@protonmail.com
            </a></p>

            <p><strong>Rimuovere un oggetto:</strong><br>
            <a href="mailto:vigonetechteam@protonmail.com?subject=Rimozione%20Annuncio">
                vigonetechteam@protonmail.com
            </a></p>
        </div>
    </div>

    <h2>Annunci in evidenza</h2>

    <div class="annunci" id="annunci"></div>

</div>

<footer>
    © 2026 Mercato Smart - Creato da Aleprogramm
</footer>

<script>
    const annunci = [
        {
            titolo: "Esempio annuncio",
            descrizione: "Qui puoi mettere un oggetto reale da vendere.",
            img: "logo.png",
            link: "#"
        }
    ];

    const container = document.getElementById("annunci");

    if (annunci.length === 0) {
        container.innerHTML = `
            <div style="padding:20px; background:var(--bg-card); border-radius:16px; text-align:center;">
                <h3>Nessun annuncio disponibile</h3>
                <p>Invia un'email per aggiungere un oggetto da vendere.</p>
            </div>
        `;
    } else {
        annunci.forEach(a => {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="card-top">
                    <img src="${a.img}" alt="${a.titolo}">
                </div>
                <div class="card-content">
                    <h3>${a.titolo}</h3>
                    <p>${a.descrizione}</p>
                    <div class="card-btn">
                        <a href="${a.link}">Vai al dettaglio</a>
                    </div>
                </div>
            `;

            container.appendChild(card);
        });
    }

    const root = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');

    function setTheme(mode) {
        if (mode === 'auto') {
            root.removeAttribute('data-theme');
            toggleBtn.textContent = 'Auto';
            localStorage.removeItem('theme');
        } else {
            root.setAttribute('data-theme', mode);
            toggleBtn.textContent = mode === 'dark' ? 'Scuro' : 'Chiaro';
            localStorage.setItem('theme', mode);
        }
    }

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
        setTheme(savedTheme);
    } else {
        setTheme('auto');
    }

    toggleBtn.addEventListener('click', () => {
        const current = localStorage.getItem('theme') || 'auto';
        if (current === 'auto') setTheme('light');
        else if (current === 'light') setTheme('dark');
        else setTheme('auto');
    });
</script>

</body>
</html>
